<style>
  :root{
    --ink:#123A52;
    --steel:#2E6B92;
    --silver:#C6CDD3;
    --charcoal:#1A1A1A;
    --paper:#FFFFFF;
    --mist:#F4F7F9;
    --line:rgba(18,58,82,.14);
    --line-strong:rgba(18,58,82,.28);
    --measure:66ch;

    /* Spacing scale */
    --space-hero: 96px;
    --space-section: 88px;
    --space-head: 44px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--charcoal);
    font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}

  .wrap{max-width:1120px;margin:0 auto;padding:0 32px;}

  .mono{
    font-family:"Hanken Grotesk",sans-serif;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--steel);
  }
  .display{
    font-family:"Newsreader",Georgia,serif;
    font-weight:500;
    color:var(--ink);
    line-height:1.06;
    letter-spacing:-.01em;
  }

  /* ---- header ---- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.86);
    backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .bar{display:flex;align-items:center;justify-content:space-between;height:74px;}
  .brand{display:flex;align-items:center;gap:13px;text-decoration:none;}
  .brand svg,.brand .logo-mark{width:34px;height:34px;flex:none;object-fit:contain;}
  .brand .name{display:flex;flex-direction:column;line-height:1.1;}
  .brand .name b{
    font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:16px;
    color:var(--ink);letter-spacing:-.01em;
  }
  nav.links{display:flex;align-items:center;gap:30px;}
  nav.links a{
    text-decoration:none;font-size:14px;font-weight:500;color:var(--ink);
    letter-spacing:.01em;position:relative;padding:4px 0;
  }
  nav.links a.soon{color:var(--silver);cursor:default;}
  nav.links a:not(.soon)::after{
    content:"";position:absolute;left:0;bottom:0;height:1.5px;width:0;
    background:var(--steel);transition:width .28s ease;
  }
  nav.links a:not(.soon):hover::after{width:100%;}
  nav.links .cta{
    background:var(--ink);color:#fff;padding:9px 16px;border-radius:2px;
    font-size:13px;letter-spacing:.02em;
  }
  nav.links .cta::after{display:none;}
  nav.links .cta:hover{background:var(--steel);}
  .menu-btn{display:none;}

  /* ---- hero ---- */
  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);}
  .hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(120% 90% at 78% 12%,#000 0%,transparent 62%);
            mask-image:radial-gradient(120% 90% at 78% 12%,#000 0%,transparent 62%);
  }
  .hero-grid{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,1.18fr) minmax(300px,.92fr);
    gap:48px;
    align-items:center;
    padding: var(--space-hero) 0;
  }
  .eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
  .eyebrow .tick{width:26px;height:1px;background:var(--line-strong);}
  h1.thesis{
    font-size:clamp(38px,5vw,60px);margin:0 0 26px;max-width:15ch;
  }
  h1.thesis em{font-style:normal;color:var(--steel);}
  .lede{font-size:18.5px;color:#33454f;max-width:52ch;margin:0 0 34px;}
  .lede strong{color:var(--ink);font-weight:600;}
  .actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .btn{
    display:inline-flex;align-items:center;gap:9px;text-decoration:none;
    font-size:15px;font-weight:500;padding:13px 22px;border-radius:2px;
    transition:all .2s ease;letter-spacing:.01em;
  }
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.primary:hover{background:var(--steel);transform:translateY(-1px);}
  .btn.ghost{color:var(--ink);border:1px solid var(--line-strong);}
  .btn.ghost:hover{border-color:var(--steel);color:var(--steel);}
  .btn .arw{transition:transform .2s ease;}
  .btn:hover .arw{transform:translateX(3px);}

  /* portrait */
  .portrait{position:relative;max-width:340px;margin-left:auto;}
  .portrait .frame{
    position:relative;
    border:1px solid var(--line-strong);
    background:var(--mist);
    aspect-ratio:4/5;
    overflow:hidden;
  }
  .portrait .frame img{
    width:100%;height:100%;
    object-fit:cover;
    object-position:center 22%;
    transform:scale(1.06);
    transform-origin:center 22%;
    position:relative;
    z-index:2;
    image-rendering:-webkit-optimize-contrast;
    backface-visibility:hidden;
  }
  .mono-fallback{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:64px;color:var(--steel);
    background:
      linear-gradient(135deg,#eaf1f5,#dfe9ef),
      repeating-linear-gradient(45deg,transparent,transparent 22px,rgba(46,107,146,.06) 22px,rgba(46,107,146,.06) 23px);
    letter-spacing:.02em;
    z-index:1;
  }
  .portrait .frame.noimg .mono-fallback{display:flex;}
  .portrait .cap{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:12px;
  }
  .portrait .cap .who{font-family:"Newsreader",Georgia,serif;font-weight:600;color:var(--ink);font-size:15px;}
  .portrait .frame::after{
    content:"";position:absolute;top:10px;right:10px;width:16px;height:16px;
    border-top:1.5px solid var(--steel);border-right:1.5px solid var(--steel);opacity:.7;
    z-index:3;
  }

  /* ---- section scaffolding ---- */
  section{padding: var(--space-section) 0;}
  .sec-head{margin-bottom: var(--space-head);max-width:60ch;}
  .sec-head .mono{font-size:13px;letter-spacing:.16em;font-weight:600;}
  .sec-head h2{
    font-family:"Newsreader",Georgia,serif;font-weight:500;color:var(--ink);
    font-size:clamp(29px,3.7vw,39px);line-height:1.08;margin:16px 0 0;letter-spacing:-.01em;
  }
  .sec-head h2.oneline{white-space:nowrap;font-size:clamp(22px,2.9vw,34px);}
  .sec-head .sec-lead{
    margin:20px 0 0;font-size:18px;line-height:1.6;color:#33454f;max-width:60ch;
  }

  /* practice areas */
  .practice{background:var(--mist);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .areas{
    display:grid;grid-template-columns:repeat(3,1fr);gap:0;
    border:1px solid var(--line-strong);background:var(--ink);
  }
  .area{
    display:block;padding:38px 32px;border-right:1px solid rgba(255,255,255,.15);
    text-decoration:none;color:inherit;position:relative;
    background:var(--ink);
    transition:background .25s ease;
    cursor:default;
  }
  .area:hover{background:#1a4a66;}
  .area:last-child{border-right:none;}
  .area h3{
    font-family:"Newsreader",Georgia,serif;font-weight:600;color:#fff;
    font-size:23px;line-height:1.16;margin:0 0 14px;letter-spacing:-.005em;
  }
  .area p{margin:0;font-size:16.5px;color:#cbdae4;line-height:1.6;}
  .area .more{
    display:inline-flex;align-items:center;gap:7px;margin-top:22px;
    font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:#8fb6cf;
  }
  .area .more .arw{transition:transform .2s ease;}
  .area:hover .more .arw{transform:translateX(3px);}

  /* how I work */
  .hiw{
    background:linear-gradient(180deg,#E9F1F8 0%,#D4E3F0 100%);
    border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);
  }
  .principles{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;}
  .principle{border-top:2px solid var(--ink);padding-top:22px;}
  .principle .k{margin-bottom:14px;}
  .principle h3{
    font-family:"Newsreader",Georgia,serif;font-weight:600;color:var(--ink);font-size:23px;margin:0 0 11px;
  }
  .principle p{margin:0;font-size:17px;color:#324551;line-height:1.6;}

  /* contact spec sheet */
  .contact{border-top:1px solid var(--line);}
  .sheet{
    display:grid;grid-template-columns:1fr 1fr;gap:0;
    border:1px solid var(--line-strong);
  }
  .cell{padding:26px 28px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  .sheet .cell:nth-child(2n){border-right:none;}
  .sheet .cell:nth-last-child(-n+2){border-bottom:none;}
  .cell .lbl{margin-bottom:10px;}
  .cell .val{font-family:"Hanken Grotesk",sans-serif;font-size:15px;color:var(--ink);line-height:1.55;}
  .cell .val a{text-decoration:none;border-bottom:1px solid var(--silver);}
  .cell .val a:hover{border-color:var(--steel);color:var(--steel);}

  .contact-cta{margin-top:38px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .contact-cta p{margin:0;font-size:15px;color:#52626b;max-width:44ch;}

  /* footer */
  footer{background:var(--charcoal);color:#9aa4ab;padding:52px 0 40px;}
  .foot-top{display:flex;justify-content:space-between;gap:30px;align-items:flex-start;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid rgba(255,255,255,.1);}
  .foot-brand{display:flex;align-items:center;gap:12px;}
  .foot-brand img{width:26px;height:26px;object-fit:contain;}
  .foot-brand b{font-family:"Newsreader",Georgia,serif;color:#fff;font-weight:600;font-size:15px;}
  .disclaimer{font-size:12.5px;line-height:1.7;color:#7d868d;max-width:70ch;margin:24px 0 0;}
  .disclaimer strong{color:#b7c0c7;font-weight:600;}
  .foot-legal{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:22px;font-size:12px;color:#6b747b;}
  .foot-legal .mono{color:#6b747b;font-size:11px;}

  /* motion */
  @media (prefers-reduced-motion:no-preference){
    .reveal{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease;}
    .reveal.in{opacity:1;transform:none;}
  }

  /* responsive */
  @media (max-width:900px){
    .hero-grid{grid-template-columns:1fr;gap:40px;padding: var(--space-hero) 0;}
    .portrait{max-width:300px;margin:0 auto;}
    .areas{grid-template-columns:1fr;}
    .area{border-right:none;border-bottom:1px solid rgba(255,255,255,.15);}
    .area:last-child{border-bottom:none;}
    .principles{grid-template-columns:1fr;gap:30px;}
    .sheet{grid-template-columns:1fr;}
    .cell{border-right:none !important;}
    .sheet .cell:not(:last-child){border-bottom:1px solid var(--line);}
  }
  @media (max-width:760px){
    .sec-head h2.oneline{white-space:normal;}
  }
  @media (max-width:640px){
    .wrap{padding:0 22px;}
    nav.links{display:none;}
    nav.links.open{
      display:flex;position:absolute;top:74px;left:0;right:0;flex-direction:column;
      align-items:flex-start;gap:18px;background:#fff;padding:24px 22px;
      border-bottom:1px solid var(--line);
    }
    .menu-btn{
      display:flex;flex-direction:column;gap:5px;background:none;border:none;
      cursor:pointer;padding:8px;
    }
    .menu-btn span{width:22px;height:2px;background:var(--ink);display:block;}
    body{font-size:16px;}
  }
</style>
